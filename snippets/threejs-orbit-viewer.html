<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbitable 3D Viewer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: radial-gradient(circle at 30% 20%, rgba(18, 126, 255, 0.18), transparent 35%),
        radial-gradient(circle at 80% 0%, rgba(0, 255, 198, 0.12), transparent 40%),
        #04070e;
      --grid: rgba(113, 200, 255, 0.16);
      --accent: #5ef2d4;
      --muted: #9cb7d5;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: #e6f4ff;
      display: grid;
      place-items: center;
      padding: 32px;
      overflow: hidden;
    }

    .frame {
      width: min(1080px, 96vw);
      height: min(680px, 80vh);
      border-radius: 24px;
      background: rgba(8, 14, 24, 0.85);
      border: 1px solid rgba(94, 242, 212, 0.18);
      box-shadow: 0 40px 100px -40px rgba(0, 0, 0, 0.75);
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: linear-gradient(transparent, rgba(255, 255, 255, 0.03)),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        linear-gradient(var(--grid) 1px, transparent 1px);
      background-size: 100% 100%, 60px 60px, 60px 60px;
      mask-image: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.35), transparent 70%);
      pointer-events: none;
    }

    header {
      position: absolute;
      inset: 16px 16px auto 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 16px;
      background: rgba(12, 26, 38, 0.8);
      border: 1px solid rgba(94, 242, 212, 0.25);
      backdrop-filter: blur(10px);
      z-index: 2;
    }

    header h1 {
      font-size: 16px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    #viewer {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .badge {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #18364f, #115d63);
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div class="frame">
    <header>
      <div class="badge">3D</div>
      <div>
        <h1>Orbit + Zoom Viewer</h1>
        <p>Drop in a GLB/GLTF model or use the sample dock blockout.</p>
      </div>
    </header>
    <div id="viewer"></div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/loaders/GLTFLoader.js';

    const viewer = document.getElementById('viewer');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#05080f');

    const camera = new THREE.PerspectiveCamera(50, viewer.clientWidth / viewer.clientHeight, 0.1, 120);
    camera.position.set(7.5, 6, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(viewer.clientWidth, viewer.clientHeight);
    viewer.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 2;
    controls.maxDistance = 45;
    controls.maxPolarAngle = Math.PI * 0.48;

    const ambient = new THREE.AmbientLight(0xa8c9ff, 0.55);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xb7f6e3, 1.1);
    keyLight.position.set(6, 12, 8);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x4db4ff, 0.35);
    rimLight.position.set(-8, 6, -10);
    scene.add(rimLight);

    const grid = new THREE.GridHelper(50, 50, 0x4df3d9, 0x1f3a4d);
    grid.material.opacity = 0.35;
    grid.material.transparent = true;
    scene.add(grid);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(50, 50),
      new THREE.MeshStandardMaterial({ color: 0x0c141f, roughness: 0.9, metalness: 0.1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.01;
    scene.add(ground);

    function buildSampleDock() {
      const wood = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, metalness: 0.25, roughness: 0.55 });
      const steel = new THREE.MeshStandardMaterial({ color: 0x62778a, metalness: 0.7, roughness: 0.3 });

      const deck = new THREE.Mesh(new THREE.BoxGeometry(8, 0.3, 4.2), wood);
      deck.position.set(0, 0.2, 0);
      scene.add(deck);

      const slatGeo = new THREE.BoxGeometry(0.16, 0.32, 4.2);
      for (let i = -3.6; i <= 3.6; i += 0.32) {
        const slat = new THREE.Mesh(slatGeo, wood.clone());
        slat.position.set(i, 0.35, 0);
        scene.add(slat);
      }

      const legGeo = new THREE.CylinderGeometry(0.18, 0.18, 3.8, 16);
      const legPositions = [
        [-3.5, -1.8], [3.5, -1.8],
        [-3.5, 1.8], [3.5, 1.8],
        [-1.2, -1.8], [1.2, -1.8],
        [-1.2, 1.8], [1.2, 1.8]
      ];
      legPositions.forEach(([x, z]) => {
        const leg = new THREE.Mesh(legGeo, steel);
        leg.position.set(x, -1.6, z);
        scene.add(leg);
      });

      const braceGeo = new THREE.BoxGeometry(8.2, 0.16, 0.2);
      const brace = new THREE.Mesh(braceGeo, steel);
      brace.position.set(0, -0.3, -2);
      scene.add(brace.clone());
      const brace2 = brace.clone();
      brace2.position.z = 2;
      scene.add(brace2);
    }

    buildSampleDock();

    // Optional: swap in your GLB / GLTF. Comment out buildSampleDock() above if you only want the import.
    // const loader = new GLTFLoader();
    // loader.load(
    //   'path/to/your-model.glb',
    //   (gltf) => {
    //     scene.add(gltf.scene);
    //   },
    //   undefined,
    //   (error) => console.error('GLTF load error', error)
    // );

    function resize() {
      const { clientWidth, clientHeight } = viewer;
      camera.aspect = clientWidth / clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(clientWidth, clientHeight);
    }
    window.addEventListener('resize', resize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    resize();
    animate();
  </script>
</body>
</html>
